# ─────────────────────────────────────────────────────────────────────────────
# Lookzene — TanStack Start frontend (lookzene.com)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name lookzene.com www.lookzene.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://lookzene.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lookzene.com;

    # SSL Certificates (Make sure to replace with your actual paths if using Cloudflare Origin)
    ssl_certificate     /etc/letsencrypt/live/lookzene.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lookzene.com/privkey.pem;

    location / {
        return 301 https://lookzene.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lookzene.com;

    # SSL Certificates (Make sure to replace with your actual paths if using Cloudflare Origin)
    ssl_certificate     /etc/letsencrypt/live/lookzene.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lookzene.com/privkey.pem;

    # Cloudflare Real IP Config
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # Product/media uploads from ERPNext (must use ^~ so the image regex below does not steal /files/*.jpg)
    location ^~ /files/ {
        root /home/frappe/projects/lookzene/sites/cp.lookzene.com/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Serve built static JS/CSS assets directly via Nginx (bypasses Node.js PM2 process to prevent 522 timeouts)
    location /assets/ {
        root /home/frappe/projects/lookzene/apps/coscore/.output/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Serve public static assets (images, favicons, fonts) directly via Nginx
    location ~* \.(png|jpg|jpeg|gif|ico|svg|json|webp|woff2?)$ {
        root /home/frappe/projects/lookzene/apps/coscore/.output/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @node_proxy;
    }

    location / {
        try_files $uri @node_proxy;
    }

    location @node_proxy {
        # PM2 Frontend runs on 3002
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
