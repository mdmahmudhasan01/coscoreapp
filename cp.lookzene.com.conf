# ─────────────────────────────────────────────────────────────────────────────
# Lookzene — ERPNext backend (cp.lookzene.com)
# ─────────────────────────────────────────────────────────────────────────────

upstream lookzene-frappe {
    server 127.0.0.1:8001 fail_timeout=0;
}

upstream lookzene-socketio-server {
    server 127.0.0.1:9001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name cp.lookzene.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://cp.lookzene.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cp.lookzene.com;

    # SSL Certificates (Make sure to replace with your actual paths if using Cloudflare Origin)
    ssl_certificate     /etc/letsencrypt/live/lookzene.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lookzene.com/privkey.pem;

    # Cloudflare Real IP Config
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    location /assets {
        alias /home/frappe/projects/lookzene/sites/assets;
    }

    # Public File uploads — serve from disk (gunicorn does not mount StaticDataMiddleware in production)
    location ^~ /files/ {
        root /home/frappe/projects/lookzene/sites/cp.lookzene.com/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~ ^/protected/(.*) {
        internal;
        try_files /cp.lookzene.com/$1 =404;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name cp.lookzene.com;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lookzene-socketio-server;
    }

    location / {
        proxy_set_header X-Frappe-Site-Name cp.lookzene.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lookzene-frappe;
    }
}
