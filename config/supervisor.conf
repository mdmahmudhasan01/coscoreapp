; Notes:
; priority=1 --> Lower priorities indicate programs that start first and shut down last
; killasgroup=true --> send kill signal to child processes too

; graceful timeout should always be lower than stopwaitsecs to avoid orphan gunicorn workers.
[program:lookzene-frappe-web]
command=/home/frappe/projects/lookzene/env/bin/gunicorn -b 127.0.0.1:8001 -w 5 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 frappe_app:application --preload
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/projects/lookzene/logs/web.log
stderr_logfile=/home/frappe/projects/lookzene/logs/web.error.log
stopwaitsecs=40
killasgroup=true
user=frappe
directory=/home/frappe/projects/lookzene/sites
startretries=10

[program:lookzene-frappe-schedule]
command=/home/frappe/projects/lookzene/bin/bench schedule
priority=3
autostart=true
stdout_logfile=/home/frappe/projects/lookzene/logs/schedule.log
stderr_logfile=/home/frappe/projects/lookzene/logs/schedule.error.log
user=frappe
directory=/home/frappe/projects/lookzene
startretries=10



[program:lookzene-frappe-short-worker]
command=/home/frappe/projects/lookzene/bin/bench worker --queue short,default
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/projects/lookzene/logs/worker.log
stderr_logfile=/home/frappe/projects/lookzene/logs/worker.error.log
user=frappe
stopwaitsecs=360
directory=/home/frappe/projects/lookzene
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10

[program:lookzene-frappe-long-worker]
command=/home/frappe/projects/lookzene/bin/bench worker --queue long,default,short
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/projects/lookzene/logs/worker.log
stderr_logfile=/home/frappe/projects/lookzene/logs/worker.error.log
user=frappe
stopwaitsecs=1560
directory=/home/frappe/projects/lookzene
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10





[program:lookzene-redis-cache]
command=/home/frappe/projects/lookzene/bin/redis-server /home/frappe/projects/lookzene/config/redis_cache.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/frappe/projects/lookzene/logs/redis-cache.log
stderr_logfile=/home/frappe/projects/lookzene/logs/redis-cache.error.log
user=frappe
directory=/home/frappe/projects/lookzene/sites
startretries=10

[program:lookzene-redis-queue]
command=/home/frappe/projects/lookzene/bin/redis-server /home/frappe/projects/lookzene/config/redis_queue.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/frappe/projects/lookzene/logs/redis-queue.log
stderr_logfile=/home/frappe/projects/lookzene/logs/redis-queue.error.log
user=frappe
directory=/home/frappe/projects/lookzene/sites
startretries=10



[program:lookzene-node-socketio]
command=/home/frappe/projects/lookzene/runtime/node/bin/node /home/frappe/projects/lookzene/apps/frappe/socketio.js
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/frappe/projects/lookzene/logs/node-socketio.log
stderr_logfile=/home/frappe/projects/lookzene/logs/node-socketio.error.log
user=frappe
directory=/home/frappe/projects/lookzene
startretries=10


[group:lookzene-web]
programs=lookzene-frappe-web,lookzene-node-socketio




[group:lookzene-workers]
programs=lookzene-frappe-schedule,lookzene-frappe-short-worker,lookzene-frappe-long-worker




[group:lookzene-redis]
programs=lookzene-redis-cache,lookzene-redis-queue
